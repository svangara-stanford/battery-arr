[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-aar-prototype"
version = "0.1.0"
description = "Local-first prototype scaffold for Battery-AAR battery lifetime prediction."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Battery-AAR team"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "h5py>=3.9",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]
parquet = ["pyarrow>=14"]
tracking = ["mlflow>=2.10", "wandb>=0.16"]
deep = ["torch>=2.2", "lightning>=2.2"]
all = ["battery-aar-prototype[dev,parquet,tracking,deep]"]

[project.scripts]
battery-aar = "battery_aar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
